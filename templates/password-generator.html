<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/homeserve-logo.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/homeserve-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <div class="header">
            <a href="{{ url_for('index') }}" class="back-link">← Back</a>
            <br>
            <h1>Password Generator</h1>
            <p class="subtitle">Click 'Generate' to get a secure password.</p>
        </div>
        <div class="card">
            <form id="gen-pass-form">
                <select id="gen-pass-mode" aria-label="Password style">
                    <option value="chars">Random characters (20)</option>
                    <option value="words">5 words with digits (e.g. maple7-river2-…)</option>
                </select>
                <input id="gen-pass-field" type="text" readonly aria-label="Generated password" spellcheck="false">
                <input type="submit" value="Generate">
                <button type="button" id="gen-pass-copy" class="secondary-button">Copy</button>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/wordlist.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/password-generator.js') }}" defer></script>
</body>
</html>
